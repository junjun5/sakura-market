# Source of truth for issue and pull request labels, synced to GitHub by
# .github/workflows/sync-labels.yml. `from_name` renames an existing label in
# place so issues keep it.

# Priority
- name: "priority: P0"
  color: "b60205"
  description: "Critical: broken for everyone or data loss; drop everything"
- name: "priority: P1"
  color: "d93f0b"
  description: "High: a core flow is broken; fix this week"
- name: "priority: P2"
  color: "fbca04"
  description: "Medium: degraded or partial; schedule soon"
- name: "priority: P3"
  color: "c2e0c6"
  description: "Low: minor or cosmetic; fix when convenient"

# Type
- name: "type: bug"
  from_name: "bug"
  color: "d73a4a"
  description: "Something does not work as documented"
- name: "type: feature"
  from_name: "enhancement"
  color: "a2eeef"
  description: "New capability or a change to existing behaviour"
- name: "type: chore"
  color: "ededed"
  description: "Maintenance: dependencies, refactors, tooling"
- name: "type: docs"
  from_name: "documentation"
  color: "0075ca"
  description: "README, AGENTS.md, PRDs or code comments"
- name: "type: security"
  color: "5319e7"
  description: "Vulnerability, hardening or secret handling"

# Area
- name: "area: api"
  color: "1d76db"
  description: "HTTP routes and business rules in src/"
- name: "area: web"
  color: "0e8a16"
  description: "Browser client in public/"
- name: "area: tooling"
  color: "5319e7"
  description: "Scripts, Git hooks, CI and repository settings"

# Triage
- name: "accessibility"
  color: "f143ab"
  description: "Barrier affecting people with disabilities"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
