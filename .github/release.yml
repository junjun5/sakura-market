# Categories for generated release notes (gh release create --generate-notes and
# the GitHub UI). Pull requests are sorted by their `type: *` label from
# .github/labels.yml.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Security
      labels: ["type: security"]
    - title: Features
      labels: ["type: feature"]
    - title: Bug fixes
      labels: ["type: bug"]
    - title: Documentation
      labels: ["type: docs"]
    - title: Maintenance
      labels: ["type: chore"]
    - title: Other changes
      labels: ["*"]
