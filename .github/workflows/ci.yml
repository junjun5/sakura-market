name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-test:
    # The job name is a required status check in the main branch ruleset.
    name: check-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The coverage gate needs Node.js 22.8+; node-20 below covers the runtime minimum.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Tests with coverage gate
        run: npm run test:coverage
      - name: Test timing report
        if: ${{ !cancelled() && hashFiles('reports/junit.xml') != '' }}
        run: npm run test:report
      - name: Upload test reports
        if: ${{ !cancelled() && hashFiles('reports/junit.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: reports/
          retention-days: 14

  node-20:
    # The runtime still supports Node.js 20 (package.json engines).
    name: test-node-20
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
