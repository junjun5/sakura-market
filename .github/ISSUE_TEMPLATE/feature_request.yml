name: Feature request
description: Propose a new capability or a change to existing behaviour.
title: "Feature: "
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe the change from the user's point of view. List new or changed routes, error codes and limits.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - API (src/)
        - Web page (public/)
        - Tooling (scripts, hooks, CI)
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: What this request deliberately does not cover. Check docs/prd/ for existing out-of-scope lists.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
